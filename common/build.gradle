architectury {
    common(enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/createdispatcher.accesswidener")
}

dependencies {
    modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    modCompileOnly("com.simibubi.create:create-fabric:${create_fabric_version}-mc${minecraft_version}")
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    annotationProcessor(implementation("io.github.llamalad7:mixinextras-common:${mixin_extras_version}"))
    modCompileOnly("purplecreate.tramways:tramways-common:$tramways_version-mc1.20.1-common")
    modRuntimeOnly("purplecreate.tramways:tramways-common:$tramways_version-mc1.20.1-common")
    // Create Railways Navigator — compile-only, guarded behind isModLoaded at runtime (compat/CrnCompat),
    // same pattern as Tramways. Version id = 1.20.1-beta-0.9.1-C6 fabric (matches the create-fabric compile env).
    modCompileOnly("maven.modrinth:create-railways-navigator:Byo7nLl9") { transitive = false }
    // DragonLib's own maven (maven.lounode.top) is unreachable; Modrinth maven, version id = 1.20.1-beta-3.0.28 fabric
    modImplementation("maven.modrinth:dragonlib:uz4tlLzk")

    // The simulator core (content/simulator/core) is Minecraft-free by design;
    // these tests run it on synthetic graphs without a game.
    testImplementation(platform("org.junit:junit-bom:5.10.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

test {
    useJUnitPlatform()
    // Opt-in perf benchmark (SimEngineBenchmarkTest): -Dsim.benchmark=true
    systemProperty "sim.benchmark", System.getProperty("sim.benchmark", "false")
    testLogging {
        events "failed", "skipped"
        exceptionFormat "full"
        showStandardStreams = System.getProperty("sim.benchmark") == "true"
    }
}

// The frontend (web/dist) is a build-time artifact now: Gradle runs the Vite build itself, so
// the jar always ships a fresh UI and web/dist is gitignored (no more committing it by hand).
// npmCi installs the locked dependency set; buildWebDist compiles the sources into dist/, which
// processResources below copies into the jar.
tasks.register("npmCi", Exec) {
    group = "build"
    description = "npm ci in web/ — installs the locked frontend dependencies"

    workingDir = rootProject.file("web")
    def npm = System.getProperty("os.name").toLowerCase().contains("windows") ? "npm.cmd" : "npm"
    commandLine(npm, "ci")
}

tasks.register("buildWebDist", Exec) {
    group = "build"
    description = "npm run build in web/ — compiles the frontend to web/dist"
    dependsOn "npmCi"

    // No inputs/outputs: Vite emits content-hashed filenames, so an up-to-date check would
    // constantly re-run anyway — and "always rebuild" is the freshness guarantee we want.
    workingDir = rootProject.file("web")
    def npm = System.getProperty("os.name").toLowerCase().contains("windows") ? "npm.cmd" : "npm"
    commandLine(npm, "run", "build")
}

processResources {
    dependsOn buildWebDist
    from(rootProject.file("web/dist")) {
        into "assets/createdispatcher/web"
    }
}
